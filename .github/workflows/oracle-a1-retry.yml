name: Oracle A1 retry

# Keeps asking Oracle to launch the instance-vex A1 (ARM) server directly
# (no stack) until there's free capacity. When the server exists it opens a GitHub issue
# (so you get an email/phone ping) and turns itself off.
#
# Needs 2 repo secrets:
#   OCI_CONFIG = the "Configuration file preview" text from Oracle's API key page
#   OCI_KEY    = full contents of the downloaded API private key (.pem)
#
# This repo is public, so the logs never print account IDs.

on:
  workflow_dispatch:      # "Run workflow" = one extra try right now
  schedule:
    - cron: "2,17,32,47 * * * *"  # one try every 15 min (was a nonstop 5-min self-trigger loop,
                                  # which made GitHub start throttling this repo)

permissions:
  actions: write   # disable itself (on success or repeated failures)
  issues: write    # "server is up" notification

concurrency:
  group: oracle-a1-retry
  cancel-in-progress: false

env:
  INSTANCE_NAME: instance-vex
  SUBNET_NAME: vex1-oracle-subnet
  SHAPE: VM.Standard.A1.Flex
  OCPUS: "1"
  MEMORY_GB: "6"
  WORKFLOW_FILE: oracle-a1-retry.yml
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  SUPPRESS_LABEL_WARNING: "True"

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OCI CLI
        run: |
          for i in 1 2 3; do
            pip install -q "oci-cli==3.95.1" && exit 0
            echo "pip install failed, retrying in 20s"; sleep 20
          done
          exit 1

      - name: Write OCI config
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          if [ -z "$OCI_CONFIG" ] || [ -z "$OCI_KEY" ]; then
            echo "::error::Add the OCI_CONFIG and OCI_KEY repo secrets first"
            exit 1
          fi
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" | tr -d '\r' | grep -v '^OCI_API_KEY' | sed '/^[[:space:]]*$/d' > ~/.oci/key.pem
          # If the BEGIN/END lines got left out when copying, add them back
          if ! grep -q 'BEGIN' ~/.oci/key.pem; then
            { echo "-----BEGIN PRIVATE KEY-----"; cat ~/.oci/key.pem; echo "-----END PRIVATE KEY-----"; } > ~/.oci/key.tmp
            mv ~/.oci/key.tmp ~/.oci/key.pem
          fi
          { echo "[DEFAULT]"
            printf '%s\n' "$OCI_CONFIG" | tr -d '\r' | grep -E '^[[:space:]]*(user|fingerprint|tenancy|region)[[:space:]]*=' \
              | sed -E 's/[[:space:]]*#.*$//; s/[[:space:]]*=[[:space:]]*/=/'
            echo "key_file=$HOME/.oci/key.pem"
          } > ~/.oci/config
          chmod 600 ~/.oci/key.pem ~/.oci/config
          for k in user fingerprint tenancy region; do
            grep -q "^$k=" ~/.oci/config || { echo "::error::OCI_CONFIG is missing the $k= line"; exit 1; }
          done

      - name: Check server / try to launch it
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE: ${{ secrets.MICRO_SSH_KEY }}
        shell: bash
        run: |
          set -uo pipefail

          server_is_up() {
            echo "$1"
            echo "done=true" >> "$GITHUB_OUTPUT"
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" \
              -f title="Oracle server instance-vex is up" \
              -f body="$2" >/dev/null || true
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/disable" || true
            echo "Workflow turned off."
            exit 0
          }
          q() { oci "$@" --raw-output 2>/tmp/oci_err; }
          show_err() {
            sed -E 's/ocid1\.[a-z0-9._-]+/<id>/g; s/([0-9a-f]{2}:){5,}[0-9a-f]{2}/<fingerprint>/g' /tmp/oci_err \
              | grep -iE '"(code|message)"' | head -4 || true
          }

          TENANCY=$(grep -m1 '^tenancy=' ~/.oci/config | cut -d= -f2- || true)
          echo "::add-mask::$TENANCY"

          # 0) Log in (retry once for blips)
          RC=1
          for _ in 1 2; do
            if AD=$(q iam availability-domain list -c "$TENANCY" --query 'data[0].name'); then RC=0; break; fi
            sleep 15
          done
          if [ "$RC" -ne 0 ] || [ -z "$AD" ]; then
            show_err; echo "::error::Couldn't log in to Oracle - check the OCI_CONFIG / OCI_KEY secrets"; exit 1
          fi
          echo "::add-mask::$AD"
          echo "Logged in to Oracle."

          # 1) Does the server already exist? (a failed check must NOT count as "no server")
          if ! N=$(q compute instance list -c "$TENANCY" --display-name "$INSTANCE_NAME" --all \
                    --query "length(data[?\"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])"); then
            echo "Couldn't check for the server this round - skipping to be safe."; exit 0
          fi
          case "$N" in ''|*[!0-9]*) N=0 ;; esac
          [ "$N" -gt 0 ] && server_is_up "SERVER EXISTS: $INSTANCE_NAME is up." \
            "The retry loop found $INSTANCE_NAME already running, so it turned itself off."

          # 2) Look up the subnet + newest Ubuntu 24.04 ARM image
          SUBNET=$(q network subnet list -c "$TENANCY" --display-name "$SUBNET_NAME" --lifecycle-state AVAILABLE \
                     --query 'data[0].id' || true)
          if [ -z "$SUBNET" ]; then
            show_err; echo "::error::Couldn't find the subnet $SUBNET_NAME"; exit 1
          fi
          echo "::add-mask::$SUBNET"
          PROHIBIT=$(q network subnet get --subnet-id "$SUBNET" --query 'data."prohibit-public-ip-on-vnic"' || echo true)
          if [ "$PROHIBIT" = "false" ]; then PUB=true; else PUB=false; fi
          echo "Public IP on launch: $PUB"

          IMAGE=$(q compute image list -c "$TENANCY" --operating-system "Canonical Ubuntu" \
                    --operating-system-version "24.04" --shape "$SHAPE" --sort-by TIMECREATED --sort-order DESC --all \
                    --query "data[?!contains(\"display-name\", 'Minimal')] | [0].id" || true)
          if [ -z "$IMAGE" ]; then
            show_err; echo "Couldn't look up the image this round - skipping."; exit 0
          fi
          echo "::add-mask::$IMAGE"

          # Use the public half of YOUR private key (MICRO_SSH_KEY secret) so the key you have opens the server.
          # Never fall back to some other key - a server you can't log into is worse than no server.
          printf '%s\n' "${SSH_PRIVATE:-}" | tr -d '\r' | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' > /tmp/body
          OK=""
          if grep -q 'BEGIN' /tmp/body; then
            cp /tmp/body /tmp/key.priv; chmod 600 /tmp/key.priv
            ssh-keygen -y -f /tmp/key.priv > /tmp/key.pub 2>/dev/null && OK=1
          else
            for T in "RSA PRIVATE KEY" "PRIVATE KEY" "OPENSSH PRIVATE KEY"; do
              { echo "-----BEGIN $T-----"; cat /tmp/body; echo "-----END $T-----"; } > /tmp/key.priv; chmod 600 /tmp/key.priv
              ssh-keygen -y -f /tmp/key.priv > /tmp/key.pub 2>/dev/null && { OK=1; break; }
            done
          fi
          rm -f /tmp/key.priv /tmp/body
          if [ -z "$OK" ]; then
            echo "::error::MICRO_SSH_KEY secret is missing or not a valid private key - not launching a server you couldn't log into"; exit 1
          fi
          echo "SSH key: $(ssh-keygen -lf /tmp/key.pub | awk '{print $2}') (from MICRO_SSH_KEY)"

          # 3) Try to launch it. Oracle rate-limits back-to-back launches, so one try
          #    per round, rotating through the 3 fault domains round by round.
          FD="FAULT-DOMAIN-$(( GITHUB_RUN_NUMBER % 3 + 1 ))"
          for FD in "$FD"; do
            if ID=$(q --no-retry compute instance launch -c "$TENANCY" --availability-domain "$AD" --fault-domain "$FD" \
                      --shape "$SHAPE" --shape-config "{\"ocpus\": $OCPUS, \"memoryInGBs\": $MEMORY_GB}" \
                      --image-id "$IMAGE" --subnet-id "$SUBNET" --assign-public-ip "$PUB" \
                      --display-name "$INSTANCE_NAME" --vnic-display-name vex1-vnic \
                      --ssh-authorized-keys-file /tmp/key.pub --query 'data.id'); then
              echo "::add-mask::$ID"
              if [ "$PUB" = "true" ]; then IPNOTE="It was created WITH a public IP."; else IPNOTE="The subnet blocks public IPs, so it has NO public IP yet - that needs fixing before SSH."; fi
              server_is_up "LAUNCHED in $FD!" \
                "Got an A1 server ($OCPUS OCPU / $MEMORY_GB GB, Ubuntu 24.04) in $FD. $IPNOTE Next: delete the API key, SSH in."
            fi
            WHY=$(grep -oiE 'out of host capacity|toomanyrequests|limitexceeded|notauthorized[a-z]*|quota[a-z ]{0,30}|"message": "[^"]{0,90}' /tmp/oci_err | head -1)
            echo "$FD: ${WHY:-unknown error}"
            case "$WHY" in
              *[Cc]apacity*) sleep 20 ;;                                     # try the next fault domain
              *[Tt]oo[Mm]any*) echo "Rate-limited - waiting for next round."; break ;;
              *) show_err; echo "Unexpected error - stopping this round."; break ;;
            esac
          done
          echo "No luck this round."

      - name: Pause the loop if it keeps failing
        # the schedule starts the next try; this only stops it when something is really broken
        if: ${{ failure() && steps.check.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE"
          # Stop if the last 3 finished runs ALSO failed (broken secrets etc.)
          FAILS=$(gh api "$R/runs?per_page=10&status=completed" \
                   --jq '[.workflow_runs[] | select(.conclusion=="failure" or .conclusion=="success")][:3] | map(select(.conclusion=="failure")) | length' || echo 0)
          if [ "$FAILS" -ge 3 ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="Oracle retry loop stopped (keeps failing)" \
              -f body="4 runs in a row failed, so the loop paused itself. Check the latest run's log, fix the problem, then re-enable the workflow." >/dev/null || true
            gh api -X PUT "$R/disable" || true
            echo "Too many failures in a row - loop paused, issue opened."
          else
            echo "This run failed - the next scheduled try is in ~15 min."
          fi
